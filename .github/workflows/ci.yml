name: CI + Publish (if needed)
on:
  push:
    branches: ["*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies for Deno
        run: deno install

      # In CI this repo is checked out standalone, without the monorepo parent.
      # Moving tsconfig.json aside keeps Deno from picking up TypeScript settings
      # that only make sense in the parent-workspace context. Move it completely
      # out of the repo so publish/check steps do not see a fake *.off file.
      - name: Lint (Deno)
        run: |
          backup_path=''
          if [ -f tsconfig.json ]; then
            backup_path="$(mktemp)"
            mv tsconfig.json "$backup_path"
            trap 'if [ -n "$backup_path" ] && [ -f "$backup_path" ]; then mv "$backup_path" tsconfig.json; fi' EXIT
          fi
          deno lint

      # Run the cheap Deno checks before the longer Bun tests so failures show up
      # earlier in the workflow.
      - name: Check (Deno)
        run: |
          backup_path=''
          if [ -f tsconfig.json ]; then
            backup_path="$(mktemp)"
            mv tsconfig.json "$backup_path"
            trap 'if [ -n "$backup_path" ] && [ -f "$backup_path" ]; then mv "$backup_path" tsconfig.json; fi' EXIT
          fi
          deno check

      - name: Install dependencies
        run: bun install

      # Keep the main Bun suite fast. The runtime matrix test intentionally spawns
      # Node, Deno, and Bun many times, which is great coverage but too heavy for
      # Bun's default 5s per-test timeout when mixed into the normal unit-test run
      # in a slow CI env like GHA.
      - name: Test (Bun, fast suite)
        run: bun test --path-ignore-patterns 'examples/runtime-matrix.bun.test.ts' --max-concurrency 1

      # Run the cross-runtime E2E example matrix separately with a longer timeout
      # and no test-level contention. This keeps CI stable while still enforcing
      # the Node 24+ / Deno / Bun compatibility promise.
      - name: Test cross-runtime example matrix
        run: bun test examples/runtime-matrix.bun.test.ts --timeout 30000 --max-concurrency 1

      # The --allow-dirty is needed because in CI the deno.lock file may be modified.
      - name: JSR check
        run: |
          backup_path=''
          if [ -f tsconfig.json ]; then
            backup_path="$(mktemp)"
            mv tsconfig.json "$backup_path"
            trap 'if [ -n "$backup_path" ] && [ -f "$backup_path" ]; then mv "$backup_path" tsconfig.json; fi' EXIT
          fi
          deno publish --dry-run --allow-dirty

  # Only run if we're on main and the test job succeeded:
  publish:
    needs: [test]
    runs-on: ubuntu-latest
    if: ${{ success() && startsWith(github.ref, 'refs/heads/main') }}

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install

      - name: "Publish package (if new version exists)"
        run: |
          backup_path=''
          if [ -f tsconfig.json ]; then
            backup_path="$(mktemp)"
            mv tsconfig.json "$backup_path"
            trap 'if [ -n "$backup_path" ] && [ -f "$backup_path" ]; then mv "$backup_path" tsconfig.json; fi' EXIT
          fi
          npx jsr publish --allow-dirty
